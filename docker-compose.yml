version: '3.8'

services:
  frontend:
    build:
      context: .
      target: runner
      # From the shell or a .env next to this file, e.g. for staging:
      #   NEXT_PUBLIC_API_URL=https://staging.azuratravelsbackend.cc/api/
      #   NEXT_PUBLIC_SITE_URL=https://staging.azuratravels.live
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_PAYSTACK_USE_POPUP: ${NEXT_PUBLIC_PAYSTACK_USE_POPUP:-true}
    container_name: ${STACK:-travelfrontend}_app
    ports:
      # Staging on the same host: STACK=travelfrontend_staging FRONTEND_PORT=3001
      # (and `docker compose -p azura-staging-web up -d frontend`).
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: travelfrontend_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge