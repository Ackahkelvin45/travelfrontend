# Add inside the HOST nginx `server { ... }` block for azuratravels.live (and
# the same for staging.azuratravels.live with the staging backend port).
# Sign-in goes through the site's own domain so the httpOnly refresh cookie is
# first-party; the hop count matches the direct API path, so the backend's
# NUM_PROXIES=2 still finds the visitor's real IP for rate limits.
location /api/auth/ {
    proxy_pass http://127.0.0.1:8012;          # backend stack nginx (NGINX_PORT)
    proxy_set_header Host azuratravelsbackend.cc;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
